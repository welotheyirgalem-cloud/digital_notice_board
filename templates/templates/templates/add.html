{% extends "base.html" %}

{% block content %}

<div class="admin-page">

    <div class="form-header">

        <h1>
            Add New Notice
        </h1>

        <a
            href="{{ url_for('dashboard') }}"
            class="secondary-button"
        >
            ← Dashboard
        </a>

    </div>


    <form
        method="POST"
        enctype="multipart/form-data"
        class="notice-form"
    >

        <div class="form-section">

            <h2>
                English
            </h2>


            <label>
                Notice Title
            </label>

            <input
                type="text"
                name="title_en"
                placeholder="Enter English title"
            >


            <label>
                Notice Content
            </label>

            <textarea
                name="content_en"
                rows="7"
                placeholder="Enter English notice..."
            ></textarea>

        </div>


        <div class="form-section">

            <h2>
                አማርኛ
            </h2>


            <label class="amharic">
                የማስታወቂያ ርዕስ
            </label>

            <input
                type="text"
                name="title_am"
                class="amharic"
                placeholder="የማስታወቂያ ርዕስ"
            >


            <label class="amharic">
                የማስታወቂያ ይዘት
            </label>

            <textarea
                name="content_am"
                class="amharic"
                rows="7"
                placeholder="የማስታወቂያ ይዘት..."
            ></textarea>

        </div>


        <div class="form-section">

            <h2>
                Media
            </h2>


            <label>
                Media Type
            </label>

            <select
                name="media_type"
                id="media_type"
                onchange="updateMediaLabel()"
            >

                <option value="none">
                    No Media
                </option>

                <option value="image">
                    Image
                </option>

                <option value="video">
                    MP4 Video
                </option>

            </select>


            <label id="media-label">
                Media File
            </label>

            <input
                type="file"
                name="media_file"
                id="media_file"
                accept="image/*,video/mp4,video/webm,video/ogg"
            >

            <p class="help-text">

                Images: JPG, JPEG, PNG, GIF, WEBP<br>

                Videos: MP4, WEBM, OGG

            </p>

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="primary-button"
            >
                Save Notice
            </button>

            <a
                href="{{ url_for('dashboard') }}"
                class="secondary-button"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
