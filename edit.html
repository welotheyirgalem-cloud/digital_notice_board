{% extends "base.html" %}

{% block content %}

<div class="admin-page">

    <div class="form-header">

        <h1>
            Edit Notice #{{ notice.id }}
        </h1>

        <a
            href="{{ url_for('dashboard') }}"
            class="secondary-button"
        >
            ← Dashboard
        </a>

    </div>


    <form
        method="POST"
        enctype="multipart/form-data"
        class="notice-form"
    >

        <div class="form-section">

            <h2>
                English
            </h2>

            <label>
                Notice Title
            </label>

            <input
                type="text"
                name="title_en"
                value="{{ notice.title_en }}"
            >


            <label>
                Notice Content
            </label>

            <textarea
                name="content_en"
                rows="7"
            >{{ notice.content_en }}</textarea>

        </div>


        <div class="form-section">

            <h2>
                አማርኛ
            </h2>

            <label class="amharic">
                የማስታወቂያ ርዕስ
            </label>

            <input
                type="text"
                name="title_am"
                class="amharic"
                value="{{ notice.title_am }}"
            >


            <label class="amharic">
                የማስታወቂያ ይዘት
            </label>

            <textarea
                name="content_am"
                class="amharic"
                rows="7"
            >{{ notice.content_am }}</textarea>

        </div>


        <div class="form-section">

            <h2>
                Media
            </h2>


            {% if notice.media_file %}

                <div class="current-media">

                    <strong>
                        Current media:
                    </strong>

                    {{ notice.media_type }}

                </div>

            {% endif %}


            <label>
                Media Type
            </label>

            <select name="media_type">

                <option
                    value="none"
                    {% if notice.media_type == 'none' %}
                        selected
                    {% endif %}
                >
                    No Media
                </option>

                <option
                    value="image"
                    {% if notice.media_type == 'image' %}
                        selected
                    {% endif %}
                >
                    Image
                </option>

                <option
                    value="video"
                    {% if notice.media_type == 'video' %}
                        selected
                    {% endif %}
                >
                    MP4 Video
                </option>

            </select>


            <label>
                Replace Media
            </label>

            <input
                type="file"
                name="media_file"
                accept="image/*,video/mp4,video/webm,video/ogg"
            >

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="primary-button"
            >
                Update Notice
            </button>

            <a
                href="{{ url_for('dashboard') }}"
                class="secondary-button"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
